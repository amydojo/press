<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Designing with rhythm</title>
    <style>
      body { margin: 0; background: #ece8df; color: #171715; font-family: system-ui, sans-serif; }
      main { width: min(46rem, calc(100% - 3rem)); margin: 12vh auto; }
      p { max-width: 34rem; font-size: clamp(1.4rem, 4vw, 2.7rem); line-height: 1.2; letter-spacing: -0.03em; }
      small { text-transform: uppercase; letter-spacing: 0.14em; }
    </style>
  </head>
  <body>
    <main>
      <small>Local experimental design fixture</small>
      <p>A good interface does not move at one speed. It pauses, repeats, and changes tempo.</p>
    </main>
  </body>
</html>
