name: Diagnose PR 2 checks

on:
  push:
    branches: [feat/genblaze-b2]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    env:
      PRESS_ENV: test
      PRESS_VERSION: 0.2.0
      FIXTURE_MODE: true
      API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.10.0
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project services/generation-api --frozen
      - name: Capture exact failures
        shell: bash
        run: |
          set +e
          pnpm typecheck:web > web-typecheck.log 2>&1
          echo $? > web-typecheck.exit
          uv run --project services/generation-api ruff check services/generation-api > ruff-check.log 2>&1
          echo $? > ruff-check.exit
          uv run --project services/generation-api mypy services/generation-api/src services/generation-api/scripts > mypy.log 2>&1
          echo $? > mypy.exit
          uv run --project services/generation-api pytest services/generation-api/tests > pytest.log 2>&1
          echo $? > pytest.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: press-pr2-exact-diagnostics
          path: |
            web-typecheck.log
            web-typecheck.exit
            ruff-check.log
            ruff-check.exit
            mypy.log
            mypy.exit
            pytest.log
            pytest.exit
          if-no-files-found: error
