name: Bootstrap generated foundation files

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.10.0
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: uv lock --project services/generation-api
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project services/generation-api --frozen
      - run: pnpm contracts:generate
      - name: Commit generated foundation files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml services/generation-api/uv.lock services/generation-api/openapi.json packages/contracts/src/generated/api.ts
          if git diff --cached --quiet; then
            echo "Generated files are already current."
          else
            git commit -m "chore: pin dependency locks and generated contracts"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: press-generated-foundation-files
          path: |
            pnpm-lock.yaml
            services/generation-api/uv.lock
            services/generation-api/openapi.json
            packages/contracts/src/generated/api.ts
