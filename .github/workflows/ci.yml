name: CI

on:
  pull_request:
    branches: [main, feat/genblaze-b2, feat/functional-product-slice, feat/visual-system-motion]
  push:
    branches: [feat/foundation-contracts, feat/genblaze-b2, feat/functional-product-slice, feat/visual-system-motion, feat/release-proof]

permissions:
  contents: read

concurrency:
  group: press-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  PRESS_ENV: test
  PRESS_VERSION: 0.2.0
  FIXTURE_MODE: true
  API_BASE_URL: http://127.0.0.1:8000
  NEXT_PUBLIC_PRESS_API_BASE_URL: http://127.0.0.1:8000
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

jobs:
  web-checks:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run web lint
        id: web_lint
        shell: bash
        run: |
          set -o pipefail
          pnpm lint:web 2>&1 | tee web-lint.log
      - name: Run web typecheck
        id: web_typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck:web 2>&1 | tee web-typecheck.log
      - name: Run web tests
        id: web_tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test:web 2>&1 | tee web-test.log
      - name: Build web with secret sentinels
        id: web_build
        env:
          B2_KEY_ID: press-ci-b2-key-id-sentinel
          B2_APPLICATION_KEY: press-ci-b2-secret-sentinel
          GENBLAZE_PROVIDER_API_KEY: press-ci-provider-secret-sentinel
        run: pnpm build
      - name: Inspect client bundle for server only credentials
        id: web_secret_inspection
        run: pnpm security:client-bundle
      - name: Upload web diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: press-web-diagnostics
          path: |
            web-lint.log
            web-typecheck.log
            web-test.log
          if-no-files-found: warn

  api-checks:
    name: API checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.10.0
          enable-cache: true
      - run: uv sync --project services/generation-api --frozen
      - name: Check Python formatting
        id: api_format
        shell: bash
        run: |
          set -o pipefail
          uv run --project services/generation-api ruff format --check services/generation-api 2>&1 | tee ruff-format.log
      - name: Run Python lint
        id: api_lint
        shell: bash
        run: |
          set -o pipefail
          uv run --project services/generation-api ruff check services/generation-api 2>&1 | tee ruff-check.log
      - name: Run Python static type checking
        id: api_mypy
        shell: bash
        run: |
          set -o pipefail
          uv run --project services/generation-api mypy services/generation-api/src services/generation-api/scripts 2>&1 | tee mypy.log
      - name: Run API tests
        id: api_tests
        shell: bash
        run: |
          set -o pipefail
          uv run --project services/generation-api pytest services/generation-api/tests 2>&1 | tee api-test.log
      - name: Upload API diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: press-api-diagnostics
          path: |
            ruff-format.log
            ruff-check.log
            mypy.log
            api-test.log
          if-no-files-found: warn

  contract-check:
    name: Contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.10.0
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project services/generation-api --frozen
      - run: pnpm contracts:check
      - run: pnpm --filter @press/contracts typecheck
      - name: Upload generated contracts for drift diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: press-generated-contracts
          path: |
            services/generation-api/openapi.json
            packages/contracts/src/generated/api.ts
          if-no-files-found: error

  e2e-smoke:
    name: E2E and accessibility smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.10.0
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project services/generation-api --frozen
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Start services
        run: |
          uv run --project services/generation-api uvicorn press_generation_api.main:app --host 127.0.0.1 --port 8000 > /tmp/press-api.log 2>&1 &
          pnpm --filter @press/web start > /tmp/press-web.log 2>&1 &
          pnpm exec wait-on http-get://127.0.0.1:8000/healthz http-get://127.0.0.1:3000
      - run: pnpm e2e
      - name: Capture service logs
        if: always()
        run: |
          cp /tmp/press-api.log apps/web/test-results/api.log || true
          cp /tmp/press-web.log apps/web/test-results/web.log || true
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: press-release-browser-evidence
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: warn

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
