name: One-use Python quality repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.10.0
      - run: uv sync --project services/generation-api --frozen
      - name: Apply safe Ruff fixes and formatting
        run: |
          uv run --project services/generation-api ruff check --fix services/generation-api
          uv run --project services/generation-api ruff format services/generation-api
      - name: Commit safe fixes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/generation-api
          if git diff --cached --quiet; then
            echo "No safe Ruff fixes were needed."
          else
            git commit -m "style(api): apply safe Ruff quality fixes"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Capture quality diagnostics
        shell: bash
        run: |
          set +e
          uv run --project services/generation-api ruff check services/generation-api > ruff-check.log 2>&1
          echo "$?" > ruff-check.exit-code
          uv run --project services/generation-api mypy services/generation-api/src services/generation-api/scripts > mypy.log 2>&1
          echo "$?" > mypy.exit-code
          cat ruff-check.log
          cat mypy.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: press-python-quality-diagnostics
          path: |
            ruff-check.log
            ruff-check.exit-code
            mypy.log
            mypy.exit-code
