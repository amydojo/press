name: Apply PR 2 deterministic fixes

on:
  push:
    branches: [feat/genblaze-b2]

permissions:
  contents: write

concurrency:
  group: press-pr2-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PRESS_ENV: test
      PRESS_VERSION: 0.2.0
      FIXTURE_MODE: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/genblaze-b2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.10.0
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project services/generation-api --frozen
      - name: Apply exact source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rewrite(path: str, transform):
              file = Path(path)
              before = file.read_text(encoding="utf-8")
              after = transform(before)
              if after == before:
                  raise RuntimeError(f"Expected deterministic edit was not applied: {path}")
              file.write_text(after, encoding="utf-8")

          rewrite(
              "apps/web/src/server/api/health.ts",
              lambda value: value.replace(
                  '  timestamp: z.iso.datetime({ offset: true }),\n',
                  '  timestamp: z.iso.datetime({ offset: true }),\n'
                  '  liveProviderConfigured: z.boolean(),\n'
                  '  durableStorageConfigured: z.boolean(),\n',
              ),
          )

          rewrite(
              "services/generation-api/src/press_generation_api/providers.py",
              lambda value: value.replace("ProviderFailure", "ProviderError").replace(
                  "  # noqa: BLE001", ""
              ),
          )

          def pipeline(value: str) -> str:
              value = value.replace(
                  "from __future__ import annotations\n\n",
                  "from __future__ import annotations\n\nfrom contextlib import suppress\n",
              )
              value = value.replace("ProviderFailure", "ProviderError").replace(
                  "  # noqa: BLE001", ""
              )
              old = '''                try:\n                    self._repository.save_attempt(\n                        pressing_id,\n                        attempt,\n                        manifest_payload={"failureCategory": failure.category.value},\n                    )\n                except StorageOperationError:\n                    # The original storage failure remains the most actionable error.\n                    pass\n'''
              new = '''                with suppress(StorageOperationError):\n                    self._repository.save_attempt(\n                        pressing_id,\n                        attempt,\n                        manifest_payload={"failureCategory": failure.category.value},\n                    )\n'''
              if old not in value:
                  raise RuntimeError("Expected pipeline suppression block was not found")
              return value.replace(old, new)

          rewrite("services/generation-api/src/press_generation_api/pipeline.py", pipeline)
          rewrite(
              "services/generation-api/src/press_generation_api/service.py",
              lambda value: value.replace('.encode("utf-8")', ".encode()"),
          )
          rewrite(
              "services/generation-api/src/press_generation_api/storage.py",
              lambda value: value.replace("  # noqa: BLE001", "").replace(
                  'str(getattr(entry, "key"))', "str(entry.key)"
              ),
          )

          def verifier(value: str) -> str:
              old = '            "In-flight execution remains process-bound; only completed-record restart reconstruction is claimed.",'
              new = '''            (\n                "In-flight execution remains process-bound; only completed-record "\n                "restart reconstruction is claimed."\n            ),'''
              if old not in value:
                  raise RuntimeError("Expected verifier limitation line was not found")
              return value.replace(old, new)

          rewrite(
              "services/generation-api/scripts/verify_live_sponsor_backbone.py",
              verifier,
          )

          def conftest(value: str) -> str:
              value = value.replace("import pytest\n", "import pytest\nfrom fastapi.testclient import TestClient\n")
              value = value.replace("ProviderFailure", "ProviderError")
              return value.replace(
                  'def client() -> "TestClient":\n    from fastapi.testclient import TestClient\n\n',
                  "def client() -> TestClient:\n",
              )

          rewrite("services/generation-api/tests/conftest.py", conftest)
          rewrite(
              "services/generation-api/tests/test_pipeline_repository.py",
              lambda value: value.replace("ProviderFailure", "ProviderError"),
          )

          def storage_test(value: str) -> str:
              value = value.replace(
                  "from dataclasses import dataclass\n",
                  "from dataclasses import dataclass\nfrom typing import ClassVar\n",
              )
              return value.replace(
                  '    instances: list["_FakeBackend"] = []',
                  "    instances: ClassVar[list[_FakeBackend]] = []",
              )

          rewrite(
              "services/generation-api/tests/test_config_and_storage.py",
              storage_test,
          )
          PY
      - name: Normalize and verify
        run: |
          uv run --project services/generation-api ruff format services/generation-api
          uv run --project services/generation-api ruff check --fix services/generation-api
          pnpm contracts:generate
          uv run --project services/generation-api pytest services/generation-api/tests
          pnpm typecheck:web
      - name: Commit deterministic fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/server/api/health.ts services/generation-api packages/contracts/src/generated/api.ts
          git commit -m "fix: satisfy sponsor backbone quality gates"
          git push origin HEAD:feat/genblaze-b2
