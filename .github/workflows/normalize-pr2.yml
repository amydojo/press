name: Normalize PR 2 generated files

on:
  push:
    branches: [feat/genblaze-b2]

permissions:
  contents: write

concurrency:
  group: press-pr2-normalize
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PRESS_ENV: test
      PRESS_VERSION: 0.2.0
      FIXTURE_MODE: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/genblaze-b2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.10.0
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project services/generation-api --frozen
      - name: Normalize Python and generated contracts
        run: |
          uv run --project services/generation-api ruff format services/generation-api
          pnpm contracts:generate
      - name: Commit deterministic output when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/generation-api packages/contracts/src/generated/api.ts
          git commit -m "chore: normalize Python and generated contracts"
          git push origin HEAD:feat/genblaze-b2
